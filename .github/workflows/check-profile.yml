name: Check profile
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily at 11:43 Asia/Shanghai, after the 08:17 profile refresh.
    - cron: '43 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check .github/scripts/update-readme.mjs
      - run: node --check .github/scripts/generate-commit-activity.mjs
      - run: node --check .github/scripts/verify-profile-freshness.mjs
      - run: node --test .github/scripts/generate-commit-activity.test.mjs
      - run: node --test .github/scripts/verify-profile-freshness.test.mjs
      - run: node --test .github/scripts/update-readme.test.mjs
  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate the published profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/scripts/update-readme.mjs
          GITHUB_ACTIVITY_OUTPUT="$RUNNER_TEMP/commit-activity.svg" node .github/scripts/generate-commit-activity.mjs
          node .github/scripts/verify-profile-freshness.mjs assets/commit-activity.svg "$RUNNER_TEMP/commit-activity.svg"
          if ! git diff --quiet -- README.md pins/; then
            git diff --stat -- README.md pins/
            echo "Published profile data is stale; the scheduled refresh did not land." >&2
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- pins/)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "Published profile data has uncommitted pin files." >&2
            exit 1
          fi
