name: Sync Repos to Profile README

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 08:00 定时对齐数据
  workflow_dispatch:   # 控制台一键手动触发
  push:
    branches:
      - main
    paths:
      - '.github/profile-pins.json'
      - '.github/scripts/**'

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-readme.mjs

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --staged --quiet; then
            echo "README.md 无内容变更，跳过提交。"
          else
            git commit -m "chore(profile): sync categorized repo matrix [skip ci]"
            git push
          fi
