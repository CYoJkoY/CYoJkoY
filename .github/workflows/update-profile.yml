name: Sync Repos to Profile README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/profile-pins.json'
      - '.github/scripts/**'

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-readme.mjs

      - name: Commit and Push README and Pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pins/

          if git diff --staged --quiet; then
            echo "README and SVG pins are up to date."
          else
            git commit -m "chore(profile): sync categorized pin cards [skip ci]"
            git push
          fi

      - name: Generate Commit Activity SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-commit-activity.mjs

      - name: Commit and Push Commit Activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-activity.svg
          if git diff --staged --quiet; then
            echo "Commit activity graphic is up to date."
          else
            git commit -m "chore(profile): refresh commit activity [skip ci]"
            git push
          fi
