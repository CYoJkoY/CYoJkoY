name: Refresh profile

on:
  schedule:
    # Daily at 08:17 Asia/Shanghai, away from the top-of-hour runner queue.
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/profile-pins.json'
      - '.github/scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify scripts
        run: |
          node --check .github/scripts/update-readme.mjs
          node --check .github/scripts/generate-commit-activity.mjs
          node --check .github/scripts/generate-activity-details.mjs

      - name: Refresh profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/update-readme.mjs
          node .github/scripts/generate-commit-activity.mjs
          node .github/scripts/generate-activity-details.mjs

      - name: Verify generated profile
        run: |
          node --test .github/scripts/generate-commit-activity.test.mjs
          node --test .github/scripts/generate-activity-details.test.mjs
          node --test .github/scripts/update-readme.test.mjs

      - name: Commit and push profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pins/ assets/
          if git diff --staged --quiet; then
            echo "Profile is up to date."
          else
            git commit -m "chore(profile): refresh profile data [skip ci]"
            git push
          fi
