name: Sync Repos to Profile README

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 08:00 定时执行
  workflow_dispatch:   # 控制台支持手动执行
  push:
    branches:
      - main
    paths:
      - '.github/profile-pins.json'
      - '.github/scripts/**'

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sync Script & Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-readme.mjs

      - name: Commit and Push Assets & README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pins/

          if git diff --staged --quiet; then
            echo "README and SVG pins are up to date."
          else
            git commit -m "chore(profile): sync categorized pin cards [skip ci]"
            git push
          fi

      - name: Generate Contribution Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}